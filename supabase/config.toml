project_id = "my-vdvoem"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "myvdvoem://"
additional_redirect_urls = ["myvdvoem://**", "http://localhost:8081/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.invite-preview]
verify_jwt = false

[functions.accept-invite]
verify_jwt = true

[functions.push-dispatch]
verify_jwt = true

[functions.delete-accounts]
verify_jwt = false
